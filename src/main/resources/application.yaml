# Backoffice web del dominio MTO. Es un CLIENTE de las APIs: no tiene base de datos, ni broker, ni
# recibe tokens. Entra con OIDC (Authorization Code) en Keycloak y llama al gateway con el token de
# la persona, servidor a servidor. El navegador solo habla el protocolo de Vaadin con esta aplicacion.
spring:
  application:
    name: mto-backoffice

  # Hilos virtuales: las peticiones de Tomcat y las tareas de Vaadin, que usa el executor de tareas de
  # Spring, esperan al gateway sin ocupar un hilo del sistema operativo cada una. El sondeo compartido (SharedPolling) hace ademas cada pasada en su propio hilo
  # virtual, asi que una llamada lenta solo retrasa su pantalla. Una peticion suelta no va mas rapida:
  # lo que cambia es cuantas pueden esperar a la vez. Con false, todo vuelve a hilos de plataforma.
  threads:
    virtual:
      enabled: ${SPRING_THREADS_VIRTUAL_ENABLED:true}

  # Timeouts del RestClient que habla con el gateway. Claves en plural de Boot 4.1. El read-timeout
  # iguala al del gateway hacia los servicios (15 s): esperar mas aqui no aporta nada.
  http:
    clients:
      connect-timeout: ${MTO_GATEWAY_CONNECT_TIMEOUT:2s}
      read-timeout: ${MTO_GATEWAY_READ_TIMEOUT:15s}

  # Sesion de servidor de Vaadin. Coincide con el idle de la sesion SSO del realm (30 min): un
  # refresh token que ya no vale y una sesion que sigue viva se traducirian en un "vuelve a entrar"
  # con la pantalla todavia abierta.
  session:
    timeout: ${SERVER_SESSION_TIMEOUT:30m}

# El registro OIDC 'keycloak' se construye en KeycloakClientRegistrations a partir de app.keycloak.*
# en lugar de declararlo aqui con issuer-uri: el descubrimiento por issuer es una llamada HTTP
# durante la creacion del bean, y con ella la aplicacion no arrancaria si Keycloak no esta listo
# todavia (mismo criterio que mto-configuration y mto-maintenance).

server:
  # 8080 stock, 8081 configuration, 8082 Keycloak, 8083 maintenance, 8084 users, 8090 gateway.
  port: ${SERVER_PORT:8085}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

vaadin:
  # Solo se escanean las vistas de esta aplicacion: acorta el arranque y evita sorpresas de addons.
  allowed-packages: com.alejandro.mtobackoffice
  launch-browser: false

app:
  keycloak:
    # Realm que emite los tokens. El 'iss' lleva este nombre y hay que resolverlo igual desde el IDE
    # y desde compose (entrada auth.mto.local en /etc/hosts, ver mto-platform).
    issuer-uri: ${KEYCLOAK_ISSUER_URI:http://auth.mto.local:8082/realms/mto}
    # Cliente confidencial de esta aplicacion en el realm (mto-backoffice/keycloak/). No es
    # mto-frontend, el cliente publico de la SPA.
    client-id: ${KEYCLOAK_CLIENT_ID:mto-backoffice}
    # Sin valor por defecto: cada perfil lo fija (dev trae el secreto local, prod lo exige).
    client-secret: ${KEYCLOAK_CLIENT_SECRET:}
    # Clientes cuyos roles se leen del access token (resource_access) para las autoridades ROLE_*:
    # los permisos de las pantallas de configuracion (mto-configuration-api: config-read,
    # config-write...), los del modulo de usuarios (mto-users-api: users-read, users-write...), los
    # del modulo de almacen (mto-stock-api: stock-read, stock-write, stock-delete, stock-adjust) y
    # los del de mantenimiento (mto-maintenance-api: maintenance-read, -write, -delete, -supervise) y
    # los de notificaciones (mto-notification-api: notification-inbox, -activity-read, -access-read) y
    # los de recursos (mto-resources-api: resources-read, -write, -fleet-write, -location-write, -delete,
    # y -telematics-write, el de la pasarela GPS, que ninguna pantalla pide pero el mapeo conoce).
    # Sus nombres de rol no se solapan, y SecurityLayerTest lo comprueba; ver KeycloakRoleMapper.
    roles-client-ids: ${KEYCLOAK_ROLES_CLIENT_IDS:mto-configuration-api,mto-users-api,mto-stock-api,mto-maintenance-api,mto-notification-api,mto-resources-api}
  gateway:
    # Toda llamada sale hacia el gateway, nunca directamente a un servicio: /api/configuration/**
    # es la ruta publica que el gateway reescribe a /api/v1/configuration/**.
    base-url: ${MTO_GATEWAY_URL:http://localhost:8090}
  frontend:
    # La SPA (mto-frontend), tal como la ve el navegador: 'Abrir en mto-frontend', en la barra, lleva
    # a la misma pantalla alli. Vacia, la barra no lo ofrece.
    url: ${MTO_FRONTEND_URL:}
  display:
    # Las fechas se pintan y se escriben en la zona del navegador de cada persona, como en
    # mto-frontend (el contenedor corre en UTC). Esta es la que vale si el navegador no la dice: la
    # de los informes de mto-maintenance. Una zona que no existe impide arrancar.
    time-zone: ${APP_DISPLAY_TIME_ZONE:Asia/Jerusalem}
  correlation:
    # Cabecera con la que cada llamada saliente se identifica. El gateway la acepta si es valida y
    # la propaga al servicio, de modo que el mismo id aparece en su log y en el del servicio.
    header-name: X-Correlation-Id

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true

logging:
  pattern:
    # [aplicacion,correlationId]: el correlationId es el de la llamada saliente en curso (lo pone el
    # interceptor del RestClient en el MDC) y permite seguirla en el gateway y en el servicio.
    correlation: "[${spring.application.name:},%X{correlationId:-}] "
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
    com.alejandro.mtobackoffice: ${LOGGING_LEVEL_APP:INFO}
