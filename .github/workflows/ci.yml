name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Sin Docker: no hay base de datos, y ni Keycloak ni el gateway escuchan durante las pruebas
      # (el registro OIDC se construye sin descubrimiento y el cliente HTTP se prueba contra un
      # servidor simulado). 'verify' incluye el build de produccion del frontend de Vaadin: el
      # plugin usa el Node del runner o descarga el suyo.
      - name: Build and run the test suite
        run: ./mvnw -B --no-transfer-progress verify

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

  image:
    name: Build image
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Solo hace falta para publicar. En un pull_request desde un fork el token es de solo
      # lectura de todas formas, por eso el login y el push van condicionados mas abajo.
      packages: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # La imagen se construye SIEMPRE, tambien en los pull request: un Dockerfile roto se ve antes
      # de fusionar. Lo que sigue condicionado es la publicacion.
      - name: Log in to GHCR
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # Una rama de trabajo no debe publicar una imagen que alguien pueda desplegar por error.
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
          # Sin publicar, la imagen se queda en el demonio local del runner: basta para saber que
          # el Dockerfile construye y que el jar entra donde el ENTRYPOINT lo espera.
          load: ${{ github.event_name != 'push' || github.ref != 'refs/heads/master' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Construir no prueba que el contenedor arranque. Esto lo comprueba de verdad: levanta la
      # imagen recien construida sin Keycloak ni gateway detras y espera a que /actuator/health
      # responda. El perfil prod exige el realm, el secreto y el gateway; se le dan valores que no
      # apuntan a nada, porque arrancar no debe tocar la red.
      - name: Smoke test the image
        if: ${{ github.event_name != 'push' || github.ref != 'refs/heads/master' }}
        run: |
          IMAGE=$(echo "${{ steps.meta.outputs.tags }}" | head -1)
          docker run -d --name mto-backoffice-smoke -p 8085:8080 \
            -e KEYCLOAK_ISSUER_URI=http://localhost:8082/realms/mto \
            -e KEYCLOAK_CLIENT_SECRET=smoke \
            -e MTO_GATEWAY_URL=http://localhost:8090 \
            "$IMAGE"
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8085/actuator/health > /dev/null; then
              echo "El contenedor responde en /actuator/health"
              docker rm -f mto-backoffice-smoke
              exit 0
            fi
            sleep 2
          done
          echo "La imagen no respondio en 60s. Log del contenedor:"
          docker logs mto-backoffice-smoke
          docker rm -f mto-backoffice-smoke
          exit 1
